[pytest]
testpaths = tests
addopts = -m "not integration"
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # pymilvus 自身在 import 时用 pkg_resources（第三方库内部，无法修复），静默其弃用警告
    ignore:pkg_resources is deprecated.*:UserWarning:pymilvus.*
markers =
    integration: 需要外部服务（Milvus/StarRocks/LLM API）的测试
